<div class="d-flex h-100 border-1 rounded-4 p-3 card p-3">
    <p-table [value]="items()" class="p-datatable-sm">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Total</th>
                <th></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item let-i="rowIndex">
            <tr>
                <td>
                    <input pInputText [(ngModel)]="item.name" class="form-control" />
                </td>

                <td>
                    <input type="number" pInputText [(ngModel)]="item.quantity" (input)="updateTotal(item)"
                        class="form-control" />
                </td>

                <td>
                    <input type="number" pInputText [(ngModel)]="item.unitPrice" (input)="updateTotal(item)"
                        class="form-control" />
                </td>

                <td>
                    <input type="number" pInputText [(ngModel)]="item.totalPrice" class="form-control" />
                </td>

                <td>
                    <button pButton icon="pi pi-trash" class="p-button-text text-danger"
                        (click)="removeItem(i)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div class="d-flex justify-content-between mt-3">
        <button pButton label="Add Item" icon="pi pi-plus" (click)="addItem()"></button>

        <h5 class="m-0">Subtotal: {{ subtotal() | number:'1.2-2' }}</h5>
    </div>
</div>
