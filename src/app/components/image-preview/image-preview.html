<div class="d-flex flex-column h-100 shadow-sm border-1 rounded-4 p-1 card">
  @if (selectedFile()) {
  <div class="d-flex justify-content-between mb-2 border-bottom">
    <div class="d-flex justify-content-start align-items-center ms-2 mt-2 col-6">
      <i class="pi pi-receipt"></i>
      <h6 class="mb-1 fw-bold text-uppercase tracking-wide ms-1">Receipt</h6>
    </div>
    <div class="d-flex justify-content-end align-items-center me-2 mt-2">
      <button type="button" class="btn text-muted p-0 border-0" (click)="onSelectedFileRemoved.emit()">
        <i class="pi pi-trash icon-button"></i>
      </button>
    </div>
  </div>
  <div class="image-scroll-viewport border-0 rounded">
    @if (imagePreview()) {
    <img [src]="imagePreview()" [style.transform]="'scale(' + scale() + ')'" (dblclick)="resetZoom()" alt="Receipt"
      class="preview-img" />
    }
  </div>
  } @else {
  <div class="flex-grow-1 d-flex align-items-center justify-content-center text-muted p-4 text-center">
    <div>
      <i class="bi bi-image d-block mb-2" style="font-size: 2rem;"></i>
      <p class="small">No image selected</p>
    </div>
  </div>
  }
</div>
